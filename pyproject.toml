[project]
name = "cli-weather"
version = "0.1.0"
description = "yr.no-style ±90 min precipitation radar map of Stockholm in the terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
basemap = ["shapely>=2.0"]

[project.scripts]
cli-weather = "cli_weather.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_weather"]

[tool.hatch.build.targets.wheel.force-include]
"data/basemap.npz" = "cli_weather/data/basemap.npz"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
